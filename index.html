<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPM ROI Calculator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0e17;
  color: #c8d0dc;
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1400px; margin: 0 auto; }
h1 {
  font-size: 28px; font-weight: 700; color: #4fc3f7;
  margin-bottom: 4px; letter-spacing: 0.5px;
}
.subtitle { color: #6b7a8f; font-size: 14px; margin-bottom: 24px; }
.tabs {
  display: flex; gap: 4px; margin-bottom: 20px;
  background: #121824; border-radius: 10px; padding: 4px;
  display: inline-flex;
}
.tab {
  padding: 10px 28px; border: none; background: transparent;
  color: #6b7a8f; font-size: 15px; font-weight: 600;
  cursor: pointer; border-radius: 8px; transition: all 0.2s;
}
.tab:hover { color: #c8d0dc; background: #1a2235; }
.tab.active { color: #fff; background: #1e88e5; }
.tab .count { color: #6b7a8f; font-size: 12px; margin-left: 6px; font-weight: 400; }
.tab.active .count { color: rgba(255,255,255,0.6); }
.header-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
}
.table-wrap {
  overflow-x: auto; background: #121824; border-radius: 10px;
  border: 1px solid #1e2a3a;
}
table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  min-width: 900px;
}
thead th {
  background: #0d1520; padding: 10px 12px; text-align: left;
  font-weight: 600; color: #6b7a8f; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.5px; white-space: nowrap; border-bottom: 1px solid #1e2a3a;
  user-select: none;
}
tbody tr {
  border-bottom: 1px solid #1a2235; transition: background 0.15s;
  cursor: pointer;
}
tbody tr:hover { background: #1a2235; }
tbody tr.expanded { background: #162030; }
td {
  padding: 10px 12px; white-space: nowrap; vertical-align: middle;
}
td.name-cell { font-weight: 600; color: #e8edf5; }
td .type-badge {
  display: inline-block; font-size: 10px; padding: 1px 6px;
  border-radius: 4px; margin-right: 6px; font-weight: 600;
}
.type-badge.alloy { background: #1b3a2a; color: #4caf50; }
.type-badge.item { background: #1a2a45; color: #64b5f6; }
td .ingredient-list { color: #6b7a8f; font-size: 11px; line-height: 1.5; white-space: nowrap; }
.positive { color: #4caf50; }
.negative { color: #ef5350; }
.price { color: #e8edf5; }
.price-small { color: #6b7a8f; font-size: 11px; }
.star-controls { display: flex; align-items: center; gap: 3px; margin-top: 5px; }
.star-btn {
  width: 24px; height: 24px; border: 1px solid #2a3a4a; border-radius: 4px;
  background: #0d1520; color: #6b7a8f; font-size: 16px; font-weight: 700;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  line-height: 1; padding: 0; user-select: none;
}
.star-btn:hover { border-color: #4fc3f7; color: #4fc3f7; }
.star-btn:active { background: #1a2235; }
.star-btn:disabled { opacity: 0.3; cursor: default; }
.star-count {
  min-width: 44px; text-align: center; font-size: 14px; font-weight: 600; color: #e8edf5;
}
.loading {
  text-align: center; padding: 60px 20px; color: #6b7a8f;
}
.loading .spinner { 
  display: inline-block; width: 32px; height: 32px;
  border: 3px solid #1e2a3a; border-top-color: #4fc3f7;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px; color: #6b7a8f; }

/* Detail panel */
.detail-panel {
  background: #0d1520; border: 1px solid #1e2a3a;
  border-radius: 10px; margin-top: 16px; padding: 20px;
  display: none;
}
.detail-panel.open { display: block; }
.detail-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 16px;
}
.detail-title { font-size: 20px; font-weight: 700; color: #e8edf5; }
.detail-close {
  background: none; border: none; color: #6b7a8f;
  font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 4px;
}
.detail-close:hover { color: #fff; background: #1a2235; }
.detail-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.stat-box {
  background: #121824; border-radius: 8px; padding: 12px 16px;
  border: 1px solid #1e2a3a;
}
.stat-label { font-size: 11px; color: #6b7a8f; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.stat-value { font-size: 18px; font-weight: 600; color: #e8edf5; }
.tree { margin-top: 12px; }
.tree-node { padding-left: 20px; border-left: 1px solid #2a3a4a; margin: 4px 0; padding: 4px 0 4px 16px; }
.tree-node.root { border-left: none; padding-left: 0; }
.tree-item {
  display: flex; align-items: center; gap: 8px; padding: 4px 8px;
  border-radius: 4px; transition: background 0.15s;
}
.tree-item:hover { background: #1a2235; }
.tree-qty { color: #6b7a8f; font-size: 12px; min-width: 48px; }
.tree-name { color: #e8edf5; font-weight: 500; }
.tree-price { color: #6b7a8f; font-size: 12px; margin-left: auto; }
.tree-time { color: #6b7a8f; font-size: 12px; margin-left: 12px; }
.tree-arrow { color: #4fc3f7; font-size: 10px; margin-right: 4px; }

#resetBtn {
  padding: 8px 16px; background: transparent; border: 1px solid #2a3a4a;
  border-radius: 6px; color: #6b7a8f; font-size: 13px; cursor: pointer;
}
#resetBtn:hover { border-color: #ef5350; color: #ef5350; }

.tab-content { display: none; }
.tab-content.active { display: block; }

@media (max-width: 768px) {
  body { padding: 12px; }
  h1 { font-size: 22px; }
  .tabs { width: 100%; }
  .tab { flex: 1; text-align: center; padding: 10px 12px; font-size: 13px; }
  td, th { padding: 8px 8px; font-size: 12px; }
  .stars-input { width: 48px; }
  table { min-width: 700px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>IPM ROI Calculator</h1>
  <div class="subtitle">Idle Planet Miner — optimal crafting &amp; smelting</div>

  <div class="header-row">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="ores">Ores <span class="count" id="oresCount"></span></button>
      <button class="tab" data-tab="alloys">Alloys <span class="count" id="alloysCount"></span></button>
      <button class="tab" data-tab="items">Items <span class="count" id="itemsCount"></span></button>
    </div>
    <button id="resetBtn" onclick="resetOverrides()">Reset overrides</button>
  </div>

  <div id="oresTab" class="tab-content active"></div>
  <div id="alloysTab" class="tab-content"></div>
  <div id="itemsTab" class="tab-content"></div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
      <button class="detail-close" onclick="closeDetail()">&times;</button>
    </div>
    <div class="detail-stats" id="detailStats"></div>
    <div class="tree" id="detailTree"></div>
  </div>
</div>

<script>
const DB = { ores: {}, alloys: {}, items: {} };
const ORDER = { ores: [], alloys: [], items: [] };
const TYPES = {};

let activeTab = 'ores';

async function init() {
  const [ores, alloys, items] = await Promise.all([
    fetch('data/ores.json').then(r => r.json()),
    fetch('data/alloys.json').then(r => r.json()),
    fetch('data/items.json').then(r => r.json()),
  ]);
  for (const o of ores) { DB.ores[o.id] = { ...o, type: 'ore' }; ORDER.ores.push(o.id); TYPES[o.id] = 'ore'; }
  for (const a of alloys) { DB.alloys[a.id] = { ...a, type: 'alloy' }; ORDER.alloys.push(a.id); TYPES[a.id] = 'alloy'; }
  for (const i of items) { DB.items[i.id] = { ...i, type: 'item' }; ORDER.items.push(i.id); TYPES[i.id] = 'item'; }

  document.getElementById('oresCount').textContent = `(${ores.length})`;
  document.getElementById('alloysCount').textContent = `(${alloys.length})`;
  document.getElementById('itemsCount').textContent = `(${items.length})`;

  document.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => switchTab(el.dataset.tab));
  });

  renderTab('ores');
}

function getEntity(id) { return DB.ores[id] || DB.alloys[id] || DB.items[id]; }

// ===== OVERRIDES =====
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem('ipm_overrides')) || {}; }
  catch { return {}; }
}
function saveOverrides(overrides) {
  localStorage.setItem('ipm_overrides', JSON.stringify(overrides));
}
let overrides = loadOverrides();

function getStars(id) { return overrides[id]?.stars ?? 0; }
function getMarket(id) { return overrides[id]?.market ?? 1; }
function setOverride(id, field, value) {
  if (!overrides[id]) overrides[id] = { stars: 0, market: 1 };
  overrides[id][field] = value;
  saveOverrides(overrides);
  renderTab(activeTab);
}
function resetOverrides() {
  if (!confirm('Reset all star and market overrides?')) return;
  overrides = {};
  localStorage.removeItem('ipm_overrides');
  renderTab(activeTab);
  closeDetail();
}

function effectivePrice(id) {
  const e = getEntity(id);
  if (!e) return 0;
  return e.basePrice * (1 + 0.2 * getStars(id)) * getMarket(id);
}

// ===== CALCULATOR =====
function calcMaterialCost(id, qty, visited) {
  visited = visited || new Set();
  if (visited.has(id)) return 0;
  visited.add(id);
  const e = getEntity(id);
  if (!e) return 0;
  if (e.type === 'ore') {
    const stars = getStars(id);
    return e.basePrice * (1 + 0.2 * stars) * qty;
  }
  if (!e.ingredients) return 0;
  let cost = 0;
  for (const ing of e.ingredients) cost += calcMaterialCost(ing.id, ing.qty * qty, visited);
  return cost;
}

function calcTotalTime(id, qty, visited) {
  visited = visited || new Set();
  if (visited.has(id)) return 0;
  visited.add(id);
  const e = getEntity(id);
  if (!e || e.type === 'ore') return 0;
  let t = (e.time || 0) * qty;
  if (e.ingredients) for (const ing of e.ingredients) t += calcTotalTime(ing.id, ing.qty * qty, visited);
  return t;
}

function calcDirectIngredientCost(id, qty) {
  const e = getEntity(id);
  if (!e || !e.ingredients) return 0;
  let cost = 0;
  for (const ing of e.ingredients) {
    cost += effectivePrice(ing.id) * ing.qty * qty;
  }
  return cost;
}

// ===== FORMAT =====
function fmtTime(sec) {
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm ' + (sec%60) + 's';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  return h + 'h ' + m + 'm';
}

function fmtPrice(n) {
  if (n === 0) return '$0';
  if (n < 1000) {
    if (n < 10) return '$' + n.toFixed(2);
    if (n < 100) return '$' + n.toFixed(1);
    return '$' + n.toFixed(0);
  }
  const s = n.toFixed(0);
  if (s.length <= 6) return '$' + s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const suf = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const tier = Math.floor((s.length-1)/3);
  if (tier >= suf.length) return '$' + s; //fallback
  const scaled = n / Math.pow(10, tier*3);
  return '$' + scaled.toFixed(1) + suf[tier];
}

// ===== TREE BUILDING =====
function buildTree(id, qty, visited) {
  visited = visited || new Set();
  if (visited.has(id)) return null;
  visited.add(id);
  const e = getEntity(id);
  if (!e) return null;
  const node = { id, name: e.name, type: e.type, qty, basePrice: e.basePrice, time: e.time || 0, children: [] };
  if (e.ingredients) {
    for (const ing of e.ingredients) {
      const child = buildTree(ing.id, ing.qty * qty, new Set(visited));
      if (child) node.children.push(child);
    }
  }
  return node;
}

function renderTree(node, depth) {
  if (!node) return '';
  const starStr = getStars(node.id) > 0 ? ' <span style="color:#ffd54f">' + '★'.repeat(Math.min(getStars(node.id),5)) + (getStars(node.id)>5?'+'+ (getStars(node.id)-5):'') + '</span>' : '';
  const mktStr = getMarket(node.id) !== 1 ? ' <span style="color:#4fc3f7">x' + getMarket(node.id) + '</span>' : '';
  let html = '<div class="tree-node' + (depth===0?' root':'') + '">';
  html += '<div class="tree-item">';
  html += '<span class="tree-qty">' + (node.qty > 1 ? node.qty + '×' : '') + '</span>';
  html += '<span class="tree-name">' + node.name + '</span>';
  html += '<span class="tree-price">' + fmtPrice(node.basePrice) + starStr + mktStr + '</span>';
  if (node.time > 0) html += '<span class="tree-time">' + fmtTime(node.time) + '</span>';
  html += '</div>';
  for (const child of node.children) html += renderTree(child, depth+1);
  html += '</div>';
  return html;
}

// ===== TABLE RENDERING =====
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById(tab + 'Tab').classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  const container = document.getElementById(tab + 'Tab');
  if (tab === 'ores') container.innerHTML = renderOresTable();
  else if (tab === 'alloys') container.innerHTML = renderAlloysTable();
  else if (tab === 'items') container.innerHTML = renderItemsTable();
}

function starControls(id) {
  const s = getStars(id);
  return '<div class="star-controls">'
    + '<button class="star-btn" onclick="event.stopPropagation();setOverride(\'' + id + '\',\'stars\',' + Math.max(0, s-1) + ')"' + (s===0?' disabled':'') + '>−</button>'
    + '<span class="star-count">' + s + '</span>'
    + '<button class="star-btn" onclick="event.stopPropagation();setOverride(\'' + id + '\',\'stars\',' + (s+1) + ')">+</button>'
    + '</div>';
}

const MARKET_VALS = [0.33, 0.5, 1, 2, 3, 4, 5];
function marketControls(id) {
  let m = getMarket(id);
  let idx = MARKET_VALS.indexOf(m);
  if (idx === -1) { idx = 2; m = 1; }
  return '<div class="star-controls">'
    + '<button class="star-btn" onclick="event.stopPropagation();setOverride(\'' + id + '\',\'market\',' + MARKET_VALS[idx-1] + ')"' + (idx<=0?' disabled':'') + '>−</button>'
    + '<span class="star-count' + (m<1?' negative':'') + '">x' + m.toFixed(2) + '</span>'
    + '<button class="star-btn" onclick="event.stopPropagation();setOverride(\'' + id + '\',\'market\',' + MARKET_VALS[idx+1] + ')"' + (idx>=MARKET_VALS.length-1?' disabled':'') + '>+</button>'
    + '</div>';
}

function renderOresTable() {
  let html = '<div class="table-wrap"><table>';
  html += '<thead><tr>';
  html += '<th>Name</th>';
  html += '<th>Base Price</th>';
  html += '<th>Smelted Into</th>';
  html += '<th>Market</th>';
  html += '<th>Effective Price</th>';
  html += '</tr></thead><tbody>';
  for (const id of ORDER.ores) {
    const row = DB.ores[id];
    const eff = effectivePrice(id);
    const smeltTarget = row.smeltedInto ? getEntity(row.smeltedInto) : null;
    html += '<tr onclick="showDetail(\'' + id + '\',\'ore\')">';
    html += '<td class="name-cell">' + row.name + starControls(id) + '</td>';
    html += '<td class="price">' + fmtPrice(row.basePrice) + '</td>';
    html += '<td>' + (smeltTarget ? smeltTarget.name : '<span class="price-small">—</span>') + '</td>';
    html += '<td>' + marketControls(id) + '</td>';
    html += '<td class="price">' + fmtPrice(eff) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderAlloysTable() {
  let html = '<div class="table-wrap"><table>';
  html += '<thead><tr>';
  html += '<th>Name</th>';
  html += '<th>Smelt Time</th>';
  html += '<th>Ingredients</th>';
  html += '<th>Base Price</th>';
  html += '<th>Market</th>';
  html += '<th>Effective Price</th>';
  html += '<th>Material Cost</th>';
  html += '<th>Profit / Craft</th>';
  html += '<th>Profit / sec</th>';
  html += '<th>Total Time</th>';
  html += '</tr></thead><tbody>';
  for (const id of ORDER.alloys) {
    const row = DB.alloys[id];
    const t = calcTotalTime(id, 1);
    const oc = calcMaterialCost(id, 1);
    const eff = effectivePrice(id);
    const profit = eff - oc;
    const pps = t > 0 ? profit / t : 0;
    const ingStr = row.ingredients.map(i => { const e = getEntity(i.id); return (i.qty>1?i.qty+'× ':'') + (e?e.name:i.id); }).join('<br>');
    html += '<tr onclick="showDetail(\'' + id + '\',\'alloy\')">';
    html += '<td class="name-cell"><span class="type-badge alloy">A</span>' + row.name + starControls(id) + '</td>';
    html += '<td>' + fmtTime(row.time) + '</td>';
    html += '<td><span class="ingredient-list">' + ingStr + '</span></td>';
    html += '<td class="price">' + fmtPrice(row.basePrice) + '</td>';
    html += '<td>' + marketControls(id) + '</td>';
    html += '<td class="price">' + fmtPrice(eff) + '</td>';
    html += '<td class="price-small">' + fmtPrice(oc) + '</td>';
    html += '<td class="' + (profit>=0?'positive':'negative') + '">' + fmtPrice(profit) + '</td>';
    html += '<td class="' + (pps>=0?'positive':'negative') + '" style="font-weight:600">' + fmtPrice(pps) + '/s</td>';
    html += '<td class="price-small">' + fmtTime(t) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderItemsTable() {
  let html = '<div class="table-wrap"><table>';
  html += '<thead><tr>';
  html += '<th>Name</th>';
  html += '<th>Craft Time</th>';
  html += '<th>Ingredients</th>';
  html += '<th>Base Price</th>';
  html += '<th>Market</th>';
  html += '<th>Effective Price</th>';
  html += '<th>Material Cost</th>';
  html += '<th>Profit / Craft</th>';
  html += '<th>Profit / sec</th>';
  html += '<th>Total Time</th>';
  html += '</tr></thead><tbody>';
  for (const id of ORDER.items) {
    const row = DB.items[id];
    const t = calcTotalTime(id, 1);
    const oc = calcMaterialCost(id, 1);
    const eff = effectivePrice(id);
    const profit = eff - oc;
    const pps = t > 0 ? profit / t : 0;
    const ingStr = row.ingredients.map(i => { const e = getEntity(i.id); return (i.qty>1?i.qty+'× ':'') + (e?e.name:i.id); }).join('<br>');
    html += '<tr onclick="showDetail(\'' + id + '\',\'item\')">';
    html += '<td class="name-cell"><span class="type-badge item">I</span>' + row.name + starControls(id) + '</td>';
    html += '<td>' + fmtTime(row.time) + '</td>';
    html += '<td><span class="ingredient-list">' + ingStr + '</span></td>';
    html += '<td class="price">' + fmtPrice(row.basePrice) + '</td>';
    html += '<td>' + marketControls(id) + '</td>';
    html += '<td class="price">' + fmtPrice(eff) + '</td>';
    html += '<td class="price-small">' + fmtPrice(oc) + '</td>';
    html += '<td class="' + (profit>=0?'positive':'negative') + '">' + fmtPrice(profit) + '</td>';
    html += '<td class="' + (pps>=0?'positive':'negative') + '" style="font-weight:600">' + fmtPrice(pps) + '/s</td>';
    html += '<td class="price-small">' + fmtTime(t) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

// ===== DETAIL PANEL =====
function showDetail(id, type) {
  const e = getEntity(id);
  if (!e) return;
  const panel = document.getElementById('detailPanel');
  panel.classList.add('open');
  document.getElementById('detailTitle').textContent = e.name;

  const eff = effectivePrice(id);
  const oc = calcMaterialCost(id, 1);
  const tt = calcTotalTime(id, 1);
  const profit = eff - oc;
  const pps = tt > 0 ? profit / tt : 0;
  const dc = calcDirectIngredientCost(id, 1);

  const stars = getStars(id);
  const market = getMarket(id);

  let statsHtml = '';
  statsHtml += '<div class="stat-box"><div class="stat-label">Base Price</div><div class="stat-value">' + fmtPrice(e.basePrice) + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Stars</div><div class="stat-value">' + (stars > 0 ? '★'.repeat(Math.min(stars,10)) + (stars>10?' +'+(stars-10):'') : '0') + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Market</div><div class="stat-value">x' + market + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Effective Price</div><div class="stat-value">' + fmtPrice(eff) + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Material Cost</div><div class="stat-value price-small">' + fmtPrice(oc) + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Profit / Craft</div><div class="stat-value positive">' + fmtPrice(profit) + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Profit / sec</div><div class="stat-value positive">' + fmtPrice(pps) + '/s</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Processing Time</div><div class="stat-value">' + fmtTime(e.time||0) + '</div></div>';
  statsHtml += '<div class="stat-box"><div class="stat-label">Total Chain Time</div><div class="stat-value">' + fmtTime(tt) + '</div></div>';
  if (e.ingredients) {
    statsHtml += '<div class="stat-box"><div class="stat-label">Ingredient Sell Value</div><div class="stat-value price-small">' + fmtPrice(dc) + '</div></div>';
    statsHtml += '<div class="stat-box"><div class="stat-label">Value Added<br><span style="font-size:11px;color:#6b7a8f">this step</span></div><div class="stat-value">' + fmtPrice(eff - dc) + '</div></div>';
  }
  document.getElementById('detailStats').innerHTML = statsHtml;

  const tree = buildTree(id, 1);
  document.getElementById('detailTree').innerHTML = '<h3 style="color:#e8edf5;font-size:15px;margin-bottom:8px">Recipe Tree</h3>' + renderTree(tree, 0);
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
}

init();
</script>
</body>
</html>
